[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adjungo"
version = "0.1.0"
description = "General Linear Method optimization library for optimal control problems"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Greg", email = "greg@example.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
# Examples only. The library itself stays on numpy and scipy: per C-1 this code
# is a reference for a C++ port, and a symbolic-algebra dependency does not
# port. `examples/symbolic.py` uses sympy to derive the callbacks the Problem
# protocol requires, which is authoring convenience, not part of the method.
examples = [
    "sympy>=1.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adjungo*"]

[tool.pytest.ini_options]
# Clause C-6: collection must be predictable. Only tests/ is collected; ad-hoc
# diagnostics under scripts/diagnostics/ are never imported by pytest.
testpaths = ["tests"]
addopts = "-q --strict-markers"
xfail_strict = true

[tool.black]
line-length = 88
target-version = ['py313']

[tool.mypy]
# C-11.4: the type-check target is the declared floor, so mypy sees the same
# language level the package promises to run on.
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Without these, mypy resolves adjungo/ twice (once by filesystem path, once as
# an installed package) and aborts before type checking.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# scipy ships no type stubs.
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py313"
